<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Capgemini Exceller Round 2 Technical Module — 201-question MCQ practice test." />
    <title>Capgemini MCQ Practice</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('mcq-practice:v1:theme'));
        document.documentElement.dataset.theme =
          t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
